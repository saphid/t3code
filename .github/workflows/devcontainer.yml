# Validates the devcontainer on PRs that touch it, and publishes a multi-arch
# prebuilt image (features baked in) to GHCR on main. The first publish creates
# the package private; flip it to public once in the package settings so
# cacheFrom works for everyone. See docs/internals/devcontainer.md.
name: devcontainer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # runCmd executes inside the fully created container, after the
      # lifecycle scripts (vp install, vp i) have run, so this smoke-tests
      # the whole setup, not just the image build.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/t3code-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/t3code-devcontainer
          push: never
          runCmd: |
            vp --version
            vp run --filter @t3tools/contracts typecheck

  # Native per-arch builds (no QEMU): amd64 for Codespaces, arm64 for Apple
  # Silicon hosts pulling the prebuilt image locally.
  publish:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # push: always is required here: the manifest job merges the per-arch
      # tags from the registry.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/t3code-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/t3code-devcontainer
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          push: always

  manifest:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/t3code-devcontainer
          platforms: linux/amd64,linux/arm64
