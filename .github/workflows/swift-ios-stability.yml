name: SwiftUI stability candidate
on:
  push:
    branches: [work/swiftui-stability-ci-20260907]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/swift-ios
            apps/mobile/modules/t3-terminal/Vendor/libghostty
      - name: Focused native regression tests
        run: python3 apps/swift-ios/Scripts/ci-stability-test.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-stability-${{ github.sha }}
          path: ${{ runner.temp }}/swiftui-stability-evidence/
          if-no-files-found: error
          retention-days: 7
