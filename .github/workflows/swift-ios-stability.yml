name: SwiftUI stability candidate
on:
  push:
    branches: [work/swiftui-stability-ci-20260907]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out exact public candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 64
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin https://github.com/saphid/t3code.git
          git sparse-checkout set --cone apps/swift-ios apps/mobile/modules/t3-terminal/Vendor/libghostty
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Focused native regression tests
        run: python3 apps/swift-ios/Scripts/ci-stability-test.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-stability-${{ github.sha }}
          path: ${{ runner.temp }}/swiftui-stability-evidence/
          if-no-files-found: error
          retention-days: 7
