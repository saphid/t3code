name: Fork Nightly

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [upstream-nightly-published]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and replace artifacts even when this stack already has a release
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/DOWNSTREAM_NIGHTLY.md"
      - ".github/downstream-nightly.json"
      - ".github/scripts/downstream-nightly.mjs"
      - ".github/scripts/downstream-nightly.test.mjs"
      - ".github/workflows/downstream-nightly.yml"

permissions:
  contents: read

concurrency:
  group: fork-nightly
  cancel-in-progress: false

jobs:
  validate:
    name: Validate fork Nightly automation
    if: github.repository == 'saphid/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout automation
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test assembler
        run: node --test .github/scripts/downstream-nightly.test.mjs

      - name: Parse manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parseManifest } from "./.github/scripts/downstream-nightly.mjs";

          parseManifest(readFileSync(".github/downstream-nightly.json", "utf8"));
          NODE

  prepare:
    name: Assemble selected patches
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      upstream_repository: ${{ steps.plan.outputs.upstream_repository }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      release_repository: ${{ steps.plan.outputs.release_repository }}
      generated_branch: ${{ steps.plan.outputs.generated_branch }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.apply.outputs.source_sha }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: plan
        name: Resolve upstream Nightly and patch stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
        run: |
          node automation/.github/scripts/downstream-nightly.mjs resolve \
            --manifest automation/.github/downstream-nightly.json \
            --output "$RUNNER_TEMP/downstream-nightly-plan.json" \
            --force "$FORCE_REBUILD"

      - name: Checkout exact upstream Nightly
        if: steps.plan.outputs.should_build == 'true'
        shell: bash
        env:
          UPSTREAM_REPOSITORY: ${{ steps.plan.outputs.upstream_repository }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -C source sparse-checkout set --no-cone '/*' '!/.repos/'
          git -C source fetch --no-tags --depth=1 upstream "refs/tags/${UPSTREAM_TAG}"
          git -C source checkout --detach FETCH_HEAD

      - id: apply
        name: Apply selected patches
        if: steps.plan.outputs.should_build == 'true'
        run: |
          node automation/.github/scripts/downstream-nightly.mjs apply \
            --plan "$RUNNER_TEMP/downstream-nightly-plan.json" \
            --source source

      - name: Push generated source
        if: steps.plan.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.plan.outputs.generated_branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C source remote add downstream "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source push --force downstream "HEAD:refs/heads/${GENERATED_BRANCH}"

  build_wsl_node_pty:
    name: Build WSL node-pty
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout generated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build Linux x64 node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Check generated source
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout generated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, build_wsl_node_pty]
    if: needs.prepare.outputs.should_build == 'true' && needs.build_wsl_node_pty.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout generated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Add public build configuration
        shell: bash
        run: cp .env.example .env

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: fork-nightly-resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $required = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing is not configured."
            exit 0
          }
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -AllowClobber -Repository PSGallery -Scope CurrentUser
          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ needs.prepare.outputs.release_repository }}
          T3CODE_DESKTOP_DISTRIBUTION: Fork
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              if ! has_all "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
                echo "macOS signing credentials exist, but APPLE_TEAM_ID or MACOS_PROVISIONING_PROFILE is missing." >&2
                exit 1
              fi
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              profile_path="$RUNNER_TEMP/t3code.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
              args+=(--signed)
            else
              echo "Building macOS artifact with a stable ad hoc update requirement."
              args+=(--stable-mac-adhoc-signature)
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if has_all "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_CLIENT_SECRET" "$AZURE_TRUSTED_SIGNING_ENDPOINT" "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              args+=(--signed)
            else
              echo "Building unsigned Windows artifact."
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify fork macOS update identity
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/*-${{ matrix.arch }}.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one macOS zip for ${{ matrix.arch }}, found ${#archives[@]}." >&2
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/fork-macos-${{ matrix.arch }}"
          mkdir -p "$extract_dir"
          ditto -x -k "${archives[0]}" "$extract_dir"
          app_path="$extract_dir/T3 Code (Fork Nightly).app"
          plist_path="$app_path/Contents/Info.plist"
          if [[ ! -f "$plist_path" ]]; then
            echo "The update archive does not contain T3 Code (Fork Nightly).app." >&2
            exit 1
          fi

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist_path")
          if [[ "$bundle_id" != "com.t3tools.t3code.fork-466f726b" ]]; then
            echo "Unexpected fork bundle identifier: $bundle_id" >&2
            exit 1
          fi
          if [[ "$executable" != "T3 Code (Fork Nightly)" ]]; then
            echo "Unexpected fork executable name: $executable" >&2
            exit 1
          fi

          ASAR_PATH="$app_path/Contents/Resources/app.asar" \
            vp exec --filter @t3tools/scripts -- node --input-type=module <<'NODE'
          import { extractFile } from "@electron/asar";

          const packageJson = JSON.parse(
            extractFile(process.env.ASAR_PATH, "package.json").toString(),
          );
          if (packageJson.name !== "t3code-fork-466f726b") {
            throw new Error(`Unexpected fork package name: ${String(packageJson.name)}`);
          }
          if (packageJson.productName !== "T3 Code (Fork Nightly)") {
            throw new Error(`Unexpected fork product name: ${String(packageJson.productName)}`);
          }
          NODE

          codesign --verify --deep --strict "$app_path"
          designated_requirement=$(codesign -d -r- "$app_path" 2>&1 | sed -n 's/^designated => //p')
          if [[ "$designated_requirement" != *'identifier "com.t3tools.t3code.fork-466f726b"'* || "$designated_requirement" == *cdhash* ]]; then
            echo "Unexpected fork designated requirement: $designated_requirement" >&2
            exit 1
          fi
          codesign --verify --strict \
            '--test-requirement==identifier "com.t3tools.t3code.fork-466f726b"' \
            "$app_path"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish fork Nightly
    needs: [prepare, quality, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.quality.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout generated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          merged=false
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm "$x64_manifest"
            merged=true
          done
          if [[ "$merged" != true ]]; then
            echo "No matching macOS updater manifests were found." >&2
            exit 1
          fi

      - name: Write release notes
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const metadata = JSON.parse(readFileSync(".github/downstream-nightly-build.json", "utf8"));
          const marker = `<!-- downstream-nightly-source: ${JSON.stringify({
            upstreamTag: metadata.upstreamTag,
            fingerprint: metadata.fingerprint,
          })} -->`;
          const patches = metadata.patches.flatMap((patch) => [
            `- ${patch.name ?? patch.label} (${patch.label})`,
            ...patch.commits.map((sha) => `  - \`${sha}\``),
          ]);
          const notes = [
            marker,
            `Custom Nightly built from [${metadata.upstreamTag}](${metadata.upstreamUrl}).`,
            "",
            `Generated source: \`${process.env.SOURCE_SHA}\``,
            `Stack fingerprint: \`${metadata.fingerprint}\``,
            "",
            "Selected patches:",
            ...patches,
            "",
            "This release contains desktop artifacts only. It does not publish the npm CLI package.",
          ].join("\n");
          writeFileSync("release-notes.md", `${notes}\n`);
          NODE

      - name: Create or repair GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          title="T3 Code Fork Nightly ${RELEASE_VERSION}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease
          fi
